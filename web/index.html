<script>/* The new look (web/shroud.css, web/js/shroud.js) is decided here, before anything is drawn, so the window never flashes the old layout.
   The first time it runs it moves the app to the Moundshroud colour theme and remembers the old choice (oa_shroud_prev), so one click brings it back. */
(function(){try{var d=document.documentElement,s=localStorage;
if(!s.getItem('oa_shroud_seen')){s.setItem('oa_shroud_seen','1');if(s.getItem('oa_theme')||s.getItem('oa_style'))s.setItem('oa_shroud_prev',JSON.stringify({theme:s.getItem('oa_theme'),style:s.getItem('oa_style')}));s.setItem('oa_theme','shroud');s.setItem('oa_style','modern');}
if(s.getItem('oa_shroud')!=='0'&&(s.getItem('oa_style')||'modern')==='modern'){d.classList.add('sh','nopro');if(s.getItem('oa_sh_rail')==='min'||innerWidth<900)d.classList.add('rail-min');}}catch(e){}})();</script>
<style>/* shown while the script files are read, so the window is never blank. The logo assembles itself: the tile
   arrives in 3D, celestial rings align, the M is drawn as a filament of light and fills with liquid gold, the crown drops on
   with a golden shockwave, and the workspace cascades into place underneath. */
#boot{position:fixed;inset:0;z-index:4000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(65% 55% at 50% 40%,#311c74 0%,#170d3a 48%,#080512 100%);color:#f3ecff;font:500 13px/1.4 "Atkinson Hyperlegible","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;cursor:pointer;transition:opacity .52s cubic-bezier(.16,1,.3,1),transform .55s cubic-bezier(.16,1,.3,1),filter .52s ease}
#boot::before{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(2px 2px at 18% 24%,rgba(255,243,194,.75),transparent),radial-gradient(1.5px 1.5px at 78% 22%,rgba(195,171,255,.7),transparent),radial-gradient(2px 2px at 82% 74%,rgba(236,195,95,.65),transparent),radial-gradient(1.5px 1.5px at 24% 78%,rgba(169,140,255,.65),transparent),radial-gradient(42% 36% at 50% 42%,rgba(161,132,255,.18),transparent 70%);animation:btCosmos 6s ease-in-out infinite alternate}
#boot.done{opacity:0;transform:scale(1.06);filter:blur(8px);pointer-events:none}
#boot .bt-stage{position:relative;width:168px;height:168px;display:grid;place-items:center;margin-bottom:2px}
#boot .bt-aura{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(161,132,255,.42) 0%,rgba(236,195,95,.18) 42%,transparent 72%);filter:blur(12px);animation:btAura 2.4s ease-in-out infinite alternate}
#boot .bt-ring{position:absolute;border-radius:50%;pointer-events:none}
#boot .bt-ring.r1{inset:2px;border:1.5px dashed rgba(236,195,95,.32);box-shadow:0 0 24px rgba(161,132,255,.22),inset 0 0 18px rgba(236,195,95,.12);animation:btRing1 1.1s cubic-bezier(.16,1,.3,1) both,btSpin 18s linear infinite}
#boot .bt-ring.r2{inset:14px;border:1px solid rgba(195,171,255,.22);border-top-color:rgba(255,243,194,.75);border-bottom-color:rgba(161,132,255,.65);animation:btRing2 1.2s cubic-bezier(.16,1,.3,1) .08s both,btSpinRev 12s linear infinite}
#boot .bt-wave{position:absolute;width:108px;height:108px;border-radius:32px;border:2px solid rgba(255,238,176,.85);box-shadow:0 0 28px rgba(236,195,95,.65);opacity:0;pointer-events:none;animation:btWave .85s cubic-bezier(.16,1,.3,1) .54s both}
#boot .bt-sparks{position:absolute;inset:-24px;pointer-events:none}
#boot .bt-sparks i{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffeeb0;box-shadow:0 0 10px #ecc35f,0 0 4px #fff;opacity:0;animation:btSpark 1.5s cubic-bezier(.16,1,.3,1) infinite}
#boot .bt-sparks i:nth-child(1){left:18%;top:72%;animation-delay:.15s}
#boot .bt-sparks i:nth-child(2){left:82%;top:68%;animation-delay:.32s}
#boot .bt-sparks i:nth-child(3){left:28%;top:24%;animation-delay:.48s}
#boot .bt-sparks i:nth-child(4){left:76%;top:26%;animation-delay:.62s}
#boot .bt-sparks i:nth-child(5){left:10%;top:46%;animation-delay:.25s}
#boot .bt-sparks i:nth-child(6){left:88%;top:44%;animation-delay:.54s}
#boot .bl{position:relative;z-index:2;width:112px;height:112px;filter:drop-shadow(0 20px 36px rgba(0,0,0,.65)) drop-shadow(0 0 38px rgba(125,79,230,.45));transition:transform .55s cubic-bezier(.16,1,.3,1),filter .5s ease}
#boot.done .bl{transform:scale(1.24) translateY(-6px);filter:drop-shadow(0 26px 48px rgba(0,0,0,.7)) drop-shadow(0 0 54px rgba(236,195,95,.65))}
#boot.done .bt-ring{transform:scale(1.35);opacity:0;transition:transform .5s ease,opacity .4s ease}
#boot .mk-tile{transform-box:fill-box;transform-origin:center;animation:btTile .65s cubic-bezier(.16,1,.3,1) both}
#boot .mk-mf{animation:btFill .48s ease-out .4s both}
#boot .mk-ml{stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px #ffeeb0);animation:btDraw .64s cubic-bezier(.65,0,.35,1) .08s both}
#boot .mk-m>path:first-child{animation:btFill .48s ease-out .48s both}
#boot .mk-cr{transform-box:fill-box;transform-origin:center bottom;animation:btCrown .58s cubic-bezier(.34,1.56,.5,1) .48s both}
#boot .mk-j{transform-box:fill-box;transform-origin:center;animation:btJewel .5s cubic-bezier(.34,1.6,.5,1) .68s both}
#boot .mk-sh{animation:btSheen .95s cubic-bezier(.22,.8,.28,1) .76s both}
#boot .bt{font:600 31px/1.05 "Sitka Display","Sitka Heading",Constantia,Georgia,serif;letter-spacing:.02em;background:linear-gradient(180deg,#fff7d6 8%,#ecc35f 52%,#b88016 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(236,195,95,.25));animation:btName .68s cubic-bezier(.16,1,.3,1) .32s both}
#boot .bt-tag{font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(218,205,255,.72);margin-top:-6px;animation:btFadeUp .55s cubic-bezier(.16,1,.3,1) .44s both}
#boot .bb{width:176px;height:3px;border-radius:99px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);overflow:hidden;margin-top:4px;animation:btFadeUp .5s ease-out .5s both}
#boot .bb i{display:block;width:45%;height:100%;border-radius:99px;background:linear-gradient(90deg,transparent,#a184ff,#ffeeb0,#ecc35f,transparent);box-shadow:0 0 12px #ecc35f;animation:bootmove 1.05s cubic-bezier(.4,0,.2,1) infinite}
#boot .bs{font-size:12.5px;color:rgba(243,236,255,.68);letter-spacing:.01em;animation:btFadeUp .5s ease-out .58s both}
/* a window that opens behind another one pauses decorative motion (html.idle, anim.css); the splash must still finish, or the logo would stay invisible */
html.idle #boot,html.idle #boot *{animation-play-state:running!important}
@keyframes btCosmos{from{transform:scale(1) rotate(0deg)}to{transform:scale(1.06) rotate(2deg)}}
@keyframes btAura{from{transform:scale(.92);opacity:.7}to{transform:scale(1.12);opacity:1}}
@keyframes btRing1{from{opacity:0;transform:scale(.55) rotate(-60deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
@keyframes btRing2{from{opacity:0;transform:scale(1.32) rotate(45deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
@keyframes btSpin{to{transform:rotate(360deg)}}
@keyframes btSpinRev{to{transform:rotate(-360deg)}}
@keyframes btWave{0%{opacity:.95;transform:scale(.82)}100%{opacity:0;transform:scale(1.68)}}
@keyframes btSpark{0%{opacity:0;transform:translateY(10px) scale(.4)}40%{opacity:.95;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-24px) scale(.2)}}
@keyframes btTile{from{opacity:0;transform:scale(.72) translateY(12px)}to{opacity:1;transform:none}}
@keyframes btDraw{to{stroke-dashoffset:0}}
@keyframes btFill{from{opacity:0}}
@keyframes btCrown{0%{opacity:0;transform:translateY(-22px) scale(.82)}70%{opacity:1;transform:translateY(2px) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes btJewel{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.45)}100%{opacity:1;transform:scale(1)}}
@keyframes btSheen{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(190px) skewX(-18deg)}}
@keyframes btName{from{opacity:0;letter-spacing:.18em;transform:translateY(10px);filter:blur(4px)}to{opacity:1;letter-spacing:.02em;transform:none;filter:blur(0)}}
@keyframes btFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bootmove{0%{transform:translateX(-115%)}100%{transform:translateX(310%)}}
@media(prefers-reduced-motion:reduce){#boot *{animation-duration:.01s!important;animation-delay:0s!important}#boot .bb i{width:100%;opacity:.5}}
</style>
