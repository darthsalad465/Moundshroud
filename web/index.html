<script>/* The new look (web/shroud.css, web/js/shroud.js) is decided here, before anything is drawn, so the window never flashes the old layout.
   The first time it runs it moves the app to the Moundshroud colour theme and remembers the old choice (oa_shroud_prev), so one click brings it back. */
(function(){try{var d=document.documentElement,s=localStorage;
if(!s.getItem('oa_shroud_seen')){s.setItem('oa_shroud_seen','1');if(s.getItem('oa_theme')||s.getItem('oa_style'))s.setItem('oa_shroud_prev',JSON.stringify({theme:s.getItem('oa_theme'),style:s.getItem('oa_style')}));s.setItem('oa_theme','shroud');s.setItem('oa_style','modern');}
if(s.getItem('oa_shroud')!=='0'&&(s.getItem('oa_style')||'modern')==='modern'){d.classList.add('sh','nopro');if(s.getItem('oa_sh_rail')==='min'||innerWidth<900)d.classList.add('rail-min');}}catch(e){}})();</script>
<style>/* shown while the script files are read, so the window is never blank. The logo assembles itself: the tile
   arrives, the M is drawn as a line and fills with gold, the crown drops on, the name settles underneath. */
#boot{position:fixed;inset:0;z-index:4000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(70% 55% at 50% 38%,#2a1a63 0%,#150d33 46%,#0a0714 100%);color:#f3ecff;font:500 13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;pointer-events:none;transition:opacity .38s ease}
#boot.done{opacity:0}
#boot .bl{width:104px;height:104px;filter:drop-shadow(0 18px 34px rgba(0,0,0,.55)) drop-shadow(0 0 34px rgba(125,79,230,.35));transition:transform .5s cubic-bezier(.16,1,.3,1)}
#boot.done .bl{transform:scale(1.18)}
#boot .mk-tile{transform-box:fill-box;transform-origin:center;animation:btTile .6s cubic-bezier(.16,1,.3,1) both}
#boot .mk-mf{animation:btFill .45s ease-out .42s both}
#boot .mk-ml{stroke-dasharray:1;stroke-dashoffset:1;animation:btDraw .62s cubic-bezier(.65,0,.35,1) .1s both}
#boot .mk-m>path:first-child{animation:btFill .45s ease-out .5s both}
#boot .mk-cr{transform-box:fill-box;transform-origin:center bottom;animation:btCrown .55s cubic-bezier(.34,1.5,.5,1) .5s both}
#boot .mk-sh{animation:btSheen .9s ease-in-out .85s both}
#boot .bt{font:600 27px/1 "Sitka Display","Sitka Heading",Constantia,Georgia,serif;letter-spacing:.01em;background:linear-gradient(180deg,#fff3c2 10%,#ecc35f 55%,#c08a1e);-webkit-background-clip:text;background-clip:text;color:transparent;animation:btName .6s cubic-bezier(.16,1,.3,1) .35s both}
#boot .bb{width:150px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;animation:btName .5s ease-out .5s both}
#boot .bb i{display:block;width:40%;height:100%;border-radius:2px;background:linear-gradient(90deg,transparent,#ecc35f,transparent);animation:bootmove 1.1s ease-in-out infinite}
#boot .bs{opacity:.55;animation:btName .5s ease-out .6s both}
/* a window that opens behind another one pauses decorative motion (html.idle, anim.css); the splash must still finish, or the logo would stay invisible */
html.idle #boot,html.idle #boot *{animation-play-state:running!important}
@keyframes btTile{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:none}}
@keyframes btDraw{to{stroke-dashoffset:0}}
@keyframes btFill{from{opacity:0}}
@keyframes btCrown{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes btSheen{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(190px) skewX(-18deg)}}
@keyframes btName{from{opacity:0;transform:translateY(8px)}}
@keyframes bootmove{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
@media(prefers-reduced-motion:reduce){#boot *{animation-duration:.01s!important;animation-delay:0s!important}#boot .bb i{width:100%;opacity:.5}}
</style>
