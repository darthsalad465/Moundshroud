<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imperium — a career in Rome</title>
<link rel="stylesheet" href="/web/fonts.css">
<link rel="stylesheet" href="imperium.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>

    <div id="hud">
      <div id="hudBar">
        <div class="hgroup">
          <div id="hOffice">Tiro</div>
          <div id="hWhen">07:12 · day 1</div>
        </div>
        <div class="hgroup mid">
          <div id="hMoney">0 ⚖</div>
          <div id="hAu">0 ✦</div>
        </div>
        <div class="hgroup right">
          <div id="hLoc"></div>
        </div>
        <div id="hudXpWrap"><i id="hXp"></i></div>
      </div>

      <div id="side">
        <div id="tracker"></div>
        <div id="squad"></div>
        <div id="mini"><canvas></canvas></div>
      </div>

      <div id="objbar"></div>
      <div id="hint"></div>
      <div id="toasts"></div>
    </div>

    <div id="dialog"></div>
    <div id="cine" class="cine"></div>
    <div id="modal"></div>
    <div id="battle"></div>
    <div id="title"></div>

    <div id="touch">
      <div class="dpad">
        <button class="dbtn du" data-k="arrowup" aria-label="up">▲</button>
        <button class="dbtn dl" data-k="arrowleft" aria-label="left">◀</button>
        <button class="dbtn dd" data-k="arrowdown" aria-label="down">▼</button>
        <button class="dbtn dr" data-k="arrowright" aria-label="right">▶</button>
        <i class="drun" aria-hidden="true"></i>
      </div>
      <div class="tacts">
        <button class="tbtn act" data-a="act">E</button>
        <button class="tbtn" data-a="journal">J</button>
        <button class="tbtn" data-a="map">M</button>
        <button class="tbtn" data-a="char">C</button>
        <button class="tbtn" data-a="back">◂</button>
      </div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="tiles.js"></script>
<script src="sprite.js"></script>
<script src="city.js"></script>
<script src="rooms.js"></script>
<script src="world.js"></script>
<script src="story.js"></script>
<script src="caesar.js"></script>
<script src="senate.js"></script>
<script src="shop.js"></script>
<script src="decor.js"></script>
<script src="audio.js"></script>
<script src="battle.js"></script>
<script src="field.js"></script>
<script src="trials.js"></script>
<script src="wider.js"></script>
<script src="citizens.js"></script>
<script src="companions.js"></script>
<script src="game.js"></script>
</body>
</html>
