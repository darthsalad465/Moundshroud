<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/phone.css">
<title>Moundshroud</title>
</head>
<body>
<div id="lock" class="lock" hidden>
  <img src="/icon.png" alt="" width="84" height="84">
  <h1>Moundshroud</h1>
  <p class="mute">Enter the PIN you set on the PC (Settings › Phone access).</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="PIN">
  <button id="unlock" class="pri">Unlock</button>
  <p id="lockmsg" class="bad"></p>
</div>
<div id="app" class="app" hidden>
  <header><b>Moundshroud</b><span id="hstat" class="mute small"></span><button id="lockbtn" class="ghost" title="Lock this phone">🔒</button></header>
  <nav><button data-tab="chat" class="on">💬 Chat</button><button data-tab="agent">🤖 Agent</button><button data-tab="routines">⏱ Routines<span id="rbadge" class="badge" hidden></span></button></nav>
  <main>
    <section id="t-chat">
      <div class="bar"><select id="model"></select><button id="newchat" class="ghost">✎ New</button></div>
      <div id="msgs" class="msgs"></div>
      <form id="cform" class="composer"><textarea id="cin" rows="1" placeholder="Message, or “make me an image of…”"></textarea><button class="pri send" aria-label="Send">↑</button></form>
    </section>
    <section id="t-agent" hidden>
      <div class="bar"><button id="anew" class="ghost">✎ New session</button><button id="alist" class="ghost">🕘 Sessions</button><span id="astat" class="mute small"></span><button id="astop" class="ghost bad" hidden>■ Stop</button></div>
      <div id="sess" class="sess" hidden></div>
      <div id="amsgs" class="msgs"></div>
      <form id="aform" class="composer"><textarea id="ain" rows="1" placeholder="Tell the agent what to build or fix…"></textarea><button class="pri send" aria-label="Send">↑</button></form>
    </section>
    <section id="t-routines" hidden><div id="rbody" class="pad"></div></section>
  </main>
</div>
<script src="/phone.js"></script>
</body>
</html>
