name: GitHub safety scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Scan tracked files for accidental private data and credentials
        run: node scripts/check-github-safety.js --revision "$GITHUB_SHA"
