name: Refresh README app reference

on:
  push:

permissions:
  contents: write

concurrency:
  group: readme-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh generated README details
        run: node scripts/update-readme.js

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README already matches this revision."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README app reference"
          git push
